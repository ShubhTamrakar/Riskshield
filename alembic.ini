# Root-level alembic.ini — delegates to backend/alembic
# This allows running `alembic upgrade head` from the repo root.

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend

# The URL is overridden at runtime in env.py from app.core.config.settings,
# but alembic requires a non-empty placeholder here.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost/riskshield

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
